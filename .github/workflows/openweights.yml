# CI do AgenticOw (a camada do OpenWeights sobre o upstream).
#
# Os workflows herdados do upstream ficam no repositório (sincronizar sem
# conflito) mas DESATIVADOS nas configurações do GitHub: dependem de segredos e
# infraestrutura da DeepSeek. Este é o único que roda aqui.
#
# Por sistema: build do monorepo, runtime empacotado (a árvore que o app
# instala), ponta a ponta do Host pelo protocolo de controle e a UI dentro da
# child webview do Tauri — com o webview real do sistema (WebView2, WKWebView,
# WebKitGTK).
name: AgenticOw

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenticow-${{ github.ref }}
  cancel-in-progress: true

env:
  # O mesmo PINNED_NODE do OpenWeights (lr_nodejs): o runtime roda nele.
  NODE_VERSION: 22.20.0

jobs:
  runtime:
    name: runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: windows-2022, target: win32-x64 }
          - { os: macos-14, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm (corepack, versão do packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Runtime empacotado
        run: node apps/openweights-host/scripts/prepare-runtime.mjs --out "${{ runner.temp }}/agenticow-runtime"

      - name: Host de ponta a ponta
        run: node --test --test-reporter=spec "apps/openweights-host/tests/*.test.mjs"
        env:
          AGENTICOW_RUNTIME: ${{ runner.temp }}/agenticow-runtime

      - name: Webview — dependências do sistema
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/webview-check

      - name: Webview — app de verificação
        working-directory: tools/webview-check
        run: cargo build

      - name: Webview — child (o desenho do AgenticOw)
        shell: bash
        run: |
          APP=tools/webview-check/target/debug/agenticow-webview-check
          if [ "$RUNNER_OS" = Windows ]; then APP="$APP.exe"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env GDK_BACKEND=x11 node tools/webview-check/run.mjs --runtime "$RUNNER_TEMP/agenticow-runtime" --app "$APP" --mode child
          else
            node tools/webview-check/run.mjs --runtime "$RUNNER_TEMP/agenticow-runtime" --app "$APP" --mode child
          fi

      - name: Webview — iframe (informativo)
        continue-on-error: true
        shell: bash
        run: |
          APP=tools/webview-check/target/debug/agenticow-webview-check
          if [ "$RUNNER_OS" = Windows ]; then APP="$APP.exe"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env GDK_BACKEND=x11 node tools/webview-check/run.mjs --runtime "$RUNNER_TEMP/agenticow-runtime" --app "$APP" --mode iframe
          else
            node tools/webview-check/run.mjs --runtime "$RUNNER_TEMP/agenticow-runtime" --app "$APP" --mode iframe
          fi
