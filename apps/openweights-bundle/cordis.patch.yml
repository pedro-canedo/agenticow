# AgenticOw sobre o dsh-web-app: terceira camada do profile "openweights"
# (dsh-base → dsh-web-app → esta). Linhas com `id` sobrepõem as de baixo; um
# patch substitui o `config` inteiro da linha, então cada linha restata todas
# as chaves que possui.

# O OpenWeights conversa com o Host pelo canal de controle (stdin/stdout).
# A linha humana "dsh web: <url>" carrega o token de lançamento e não pode ir
# para log nenhum; o navegador nunca é aberto pelo Host — a UI mora numa
# webview do app. Sem `surfaceContext`: a seção que ele acrescenta ao prompt
# diria ao modelo que "a implementação do DeepSeek Harness" está na pasta do
# runtime, o que num runtime empacotado só engana.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# Identidade que o modelo recebe.
- id: system-prompt
  config:
    personaPrefix: >-
      You are AgenticOw, the coding agent of OpenWeights, powered by the {{model}} model.
    personaSuffix: Your working directory is {{cwd}}.

# Nada sai para a DeepSeek sem a pessoa escolher o provedor dela:
# - a telemetria enviava o trecho do log da sessão a harness-telemetry.deepseeksvc.com
#   quando a pessoa dava feedback numa mensagem (o host também exporta
#   DSH_TELEMETRY_DISABLED);
# - sem telemetria, os botões e o comando de feedback só enganariam;
# - o inventário anexava a lista de plugins ativos às requisições à API da DeepSeek.
- id: session-telemetry-otel
  disabled: true

- id: command-feedback
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# O cérebro vem sempre do OpenWeights: as rotas `openweights`, `openrouter` e
# `ninerouter` que o app entrega pelo catálogo (llm-pi-ai), configuradas nas telas
# dele. Sem o adaptador nativo da DeepSeek não há rota `deepseek-official` — e o
# onboarding do upstream, que pedia a chave dela quando nenhum provedor servia,
# se dá por encerrado sozinho (sem adaptador, não há o que oferecer).
- id: llm-deepseek
  disabled: true

# A busca na web do upstream é um pedido à API da DeepSeek (e as alternativas,
# Exa e Perplexity, também são serviços de fora). Sem provedor, `web_search`
# responde ao modelo que a busca não está disponível; `web_fetch` continua.
- id: web-search-deepseek
  disabled: true

# Padrão da composição, antes de qualquer catálogo; o plugin do catálogo troca
# pelo primeiro modelo que o app entregar.
- id: agent-default-model
  config:
    provider: openweights
    model: sem-modelo

- insert:
    # Anuncia `ready` ao app quando a árvore assenta e atende os comandos dele.
    - id: openweights-control
      name: '@openweights/agenticow-plugins/control'

    # Polyfill dos Iterator helpers para o WKWebView do macOS 14 (Safari < 18.4).
    - id: openweights-compat
      name: '@openweights/agenticow-plugins/compat'

    # Modelos e provedores do app (llm-pi-ai), chaves só em memória.
    - id: openweights-catalog
      name: '@openweights/agenticow-plugins/catalog'

    # Idioma escolhido no app.
    - id: openweights-preferencias
      name: '@openweights/agenticow-plugins/preferencias'

    # Marca e pt-BR no navegador.
    - id: openweights-ui
      name: '@openweights/agenticow-ui'
